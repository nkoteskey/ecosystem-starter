name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          pip install --quiet ruff
          ruff check scripts
          ruff format --check scripts
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x scripts/land.sh scripts/full-gate.sh scripts/wt.sh \
            scripts/invariants-check.sh scripts/standards-check.sh \
            scripts/git-hooks/pre-push bootstrap.sh

  gate-selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: configure git identity for the fixture repositories
        run: |
          git config --global user.email "ci"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: gate scripts self-test
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: template bootstrap tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: claims registry is up to date
        run: python3 scripts/claims.py sync-registry --check
      - name: validate the shipped merge-gate.toml
        run: python3 scripts/mergegate_config.py validate
      - name: full gate dry run
        run: bash scripts/full-gate.sh --dry-run
      - name: bootstrap into a scratch repository
        run: |
          d="$(mktemp -d)"
          git -C "$d" init -q -b main
          bash bootstrap.sh "$d" --name scratch --apps web,admin
          (cd "$d" && python3 scripts/mergegate_config.py validate && bash scripts/full-gate.sh --dry-run)
