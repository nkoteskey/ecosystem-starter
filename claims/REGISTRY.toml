# claims/REGISTRY.toml — declared (non-crate) shared services.
#
# Crate services are derived mechanically from `cargo metadata` (a crate
# reachable via path dependencies from >= `claims.min_consumers` of the
# `claims.app_crates` in merge-gate.toml) and do NOT appear here. This file
# lists only the shared units that are not workspace crates, each traced to
# the reason it is shared.
#
# Parsed with the TOML subset described in docs/MERGE_GATE.md: [services.<id>]
# tables containing strings and arrays of strings only.
#
# Hand-maintained input. Output (claims/<service>.md) is generated by
# `python3 scripts/claims.py sync-registry` and must never be hand-edited.

[services.shared-ui]
kind = "declared"
paths = ["packages/shared-ui/**"]
consumers = ["example-app"]
source = "packages/shared-ui is a file: dependency of every frontend package.json"

[services.workspace-manifests]
kind = "declared"
paths = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml"]
consumers = ["example-app"]
source = "workspace manifests are shared by every crate"

[services.ci-workflows]
kind = "declared"
paths = [".github/**", "scripts/**", "merge-gate.toml", "ci/baseline.json"]
consumers = ["example-app"]
source = "the gate itself: a change here affects every landing"
